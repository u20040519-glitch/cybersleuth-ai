# =============================================================================
# CYBERSLEUTH AI - Netlify deployment configuration
# =============================================================================
# Connect this repository to Netlify and everything below is applied
# automatically - no manual build settings required.
#
#   Netlify  ->  Add new site  ->  Import an existing project
#             ->  Connect to GitHub  ->  select this repository
#             ->  Deploy
#
# The `base` directory is set to `frontend`, so Netlify installs the npm
# dependencies from frontend/package.json and publishes frontend/dist.
# =============================================================================

[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Node 18 reached end-of-life and is no longer installed on the Netlify
  # build image; Node 20 is the version used by the Docker image and by the
  # devcontainer, so the three must agree.
  NODE_VERSION = "20"

  # Absolute URL of the deployed API. The default points at the Render
  # service created from render.yaml.
  #
  # OVERRIDE THIS in Netlify -> Site configuration -> Environment variables
  # as soon as the API lives somewhere else (a staging host, a tunnel, a
  # different Render service). Only public values may be set here - the
  # Gemini key and the Supabase service-role key must NEVER be exposed.
  VITE_API_BASE_URL = "https://cybersleuth-api.onrender.com/api"

# ---------------------------------------------------------------------------
# API proxy
# ---------------------------------------------------------------------------
# The SPA catch-all below rewrites EVERY unknown path to /index.html with a
# HTTP 200. Without an explicit rule, an API call made against a relative
# base URL (/api/...) would therefore be answered with the HTML of the SPA
# instead of JSON - the request "succeeds" and the application then fails to
# parse the response.
#
# This rule proxies /api/* to the API host BEFORE the catch-all is evaluated.
# `status = 200` rewrites the proxied response status so the browser never
# sees a redirect, and `force = true` makes the rule apply even when a file
# with the same name exists in the published directory.
#
# Netlify proxies with a fixed timeout (26 seconds by default) - long
# running forensic analyses should therefore be pointed at the API host
# directly by overriding VITE_API_BASE_URL above.
[[redirects]]
  from = "/api/*"
  to = "https://cybersleuth-api.onrender.com/api/:splat"
  status = 200
  force = true

# ---------------------------------------------------------------------------
# SPA fallback
# ---------------------------------------------------------------------------
# React Router serves /deeptrace, /investigations/<uuid>, /evidence/upload etc.
# as client-side routes. Without this rewrite Netlify returns 404 for any
# direct navigation or page refresh on those paths.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ---------------------------------------------------------------------------
# Security headers
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-DNS-Prefetch-Control = "off"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# Hashed build assets are immutable - cache them hard.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# index.html must never be cached, or clients keep loading an old asset bundle.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# ---------------------------------------------------------------------------
# Never expose the backend secrets through the static build.
# ---------------------------------------------------------------------------
# Any VITE_* variable is inlined into the browser bundle. Only set public
# values here - NEVER the Gemini API key or the Supabase service-role key.
#
#   VITE_SUPABASE_URL      = https://<project>.supabase.co
#   VITE_SUPABASE_ANON_KEY = <anon key, safe for the browser, RLS-protected>
#   VITE_API_BASE_URL      = https://<backend-host>/api
#
# Set these in Netlify -> Site configuration -> Environment variables.
