# =============================================================================
# PROJECT NEXUS AI - Docker Compose
# =============================================================================
# Production deployment with PostgreSQL, Redis, and backend.
# =============================================================================

version: "3.8"

services:
  # -----------------------------------------------------------
  # PostgreSQL Database
  # -----------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: nexus-ai-db
    environment:
      POSTGRES_USER: nexus_user
      POSTGRES_PASSWORD: nexus_password
      POSTGRES_DB: nexus_ai
    volumes:
      - nexus_db_data:/var/lib/postgresql/data
      - ./migrations/sql/001_enable_rls.sql:/docker-entrypoint-initdb.d/001_enable_rls.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus_user -d nexus_ai"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexus-network

  # -----------------------------------------------------------
  # Redis (Rate Limiting & Caching)
  # -----------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: nexus-ai-redis
    command: redis-server --appendonly yes
    volumes:
      - nexus_redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexus-network

  # -----------------------------------------------------------
  # Backend API (FastAPI)
  # -----------------------------------------------------------
  backend:
    build: .
    container_name: nexus-ai-backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://nexus_user:nexus_password@db:5432/nexus_ai
      REDIS_URL: redis://redis:6379/0
      APP_ENV: production
      APP_DEBUG: "false"
      APP_SECRET_KEY: ${APP_SECRET_KEY}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 30
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: 7
      SESSION_COOKIE_SECURE: "true"
      SESSION_COOKIE_SAMESITE: lax
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL}
      SMTP_FROM_NAME: "PROJECT NEXUS AI"
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: gemini-1.5-flash
      SENTRY_DSN: ${SENTRY_DSN}
      SENTRY_ENVIRONMENT: production
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY}
      BACKUP_RETENTION_DAYS: 30
      ORG_NAME: ${ORG_NAME}
      ORG_SUPPORT_EMAIL: ${ORG_SUPPORT_EMAIL}
      ORG_PRIVACY_EMAIL: ${ORG_PRIVACY_EMAIL}
      ORG_WEBSITE: ${ORG_WEBSITE}
    ports:
      - "8000:8000"
    volumes:
      - ./backups:/app/backups
    networks:
      - nexus-network
    restart: unless-stopped

  # -----------------------------------------------------------
  # Frontend (React + Vite)
  # -----------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nexus-ai-frontend
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api
    ports:
      - "3000:80"
    networks:
      - nexus-network
    restart: unless-stopped

# -----------------------------------------------------------
# Volumes
# -----------------------------------------------------------
volumes:
  nexus_db_data:
  nexus_redis_data:

# -----------------------------------------------------------
# Networks
# -----------------------------------------------------------
networks:
  nexus-network:
    driver: bridge
